name: Snowflake CI/CD

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  deploy-dev:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        run: pip install snowflake-cli

      - name: Configure Snowflake key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$HOME/snowflake_ci_key.pem"
          chmod 600 "$HOME/snowflake_ci_key.pem"

      - name: Deploy migrations to DEV
        run: |
          snow sql -f migrations/001_create_bronze_tables.sql \
            -c dev \
            --private-key-file "$HOME/snowflake_ci_key.pem" \
            --authenticator SNOWFLAKE_JWT

          snow sql -f migrations/002_add_masking_policy.sql \
            -c dev \
            --private-key-file "$HOME/snowflake_ci_key.pem" \
            --authenticator SNOWFLAKE_JWT

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        run: pip install snowflake-cli

      - name: Configure Snowflake key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$HOME/snowflake_ci_key.pem"
          chmod 600 "$HOME/snowflake_ci_key.pem"

      - name: Deploy migrations to PROD
        run: |
          snow sql -f migrations/001_create_bronze_tables.sql \
            -c prod \
            --private-key-file "$HOME/snowflake_ci_key.pem" \
            --authenticator SNOWFLAKE_JWT

          snow sql -f migrations/002_add_masking_policy.sql \
            -c prod \
            --private-key-file "$HOME/snowflake_ci_key.pem" \
            --authenticator SNOWFLAKE_JWT
